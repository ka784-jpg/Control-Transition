name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  examples:
    timeout-minutes: 20
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: julia-actions/setup-julia@da908477b5db94c10ffce8cfea9f2b3b9d5db687
        with:
          version: '1.12.6'
      - run: julia --project=. --startup-file=no tests/runtests.jl
      - run: julia --project=. --startup-file=no examples/classical.jl results/classical
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python -m pip install -r examples/requirements-qiskit.txt
      - run: python -m unittest discover -s tests -p test_qiskit.py -v
      - run: python examples/qiskit_local.py results/qiskit
      - run: python tests/integrity.py --plots
      - run: python examples/plot.py results/classical results/classical/plot.png
      - run: python examples/plot.py results/qiskit results/qiskit/plot.png
